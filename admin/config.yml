# Sivun hallinnan asetukset (Sveltia CMS)
# repo on jo asetettu: xJyri/portfolio (vaihda vain, jos repositorion nimi on eri)

backend:
  name: github
  repo: xJyri/portfolio
  branch: main

media_folder: media
public_folder: media

collections:
  - name: sivu
    label: Sivun sisältö
    files:
      - name: sisalto
        label: Kaikki sisältö
        file: content/site.json
        format: json
        fields:
          - { name: firstName, label: Etunimi, widget: string }
          - { name: lastName, label: Sukunimi, widget: string }
          - { name: email, label: Sähköposti, widget: string, hint: "Tämä kopioituu leikepöydälle, kun kävijä painaa kirjekuorta" }
          - { name: linkedin, label: LinkedIn-osoite, widget: string, hint: "Koko osoite, alkaen https://" }
          - name: fi
            label: Suomi (FI)
            widget: object
            fields:
              - { name: subtitle, label: Alaotsikko etusivulla, widget: string }
              - { name: about, label: "Minusta-teksti (jätä tyhjä rivi kappaleiden väliin)", widget: text }
          - name: en
            label: Englanti (EN)
            widget: object
            fields:
              - { name: subtitle, label: Subtitle on the home page, widget: string }
              - { name: about, label: "About me text (leave an empty line between paragraphs)", widget: text }
          - name: projects
            label: Projektit
            label_singular: projekti
            widget: list
            summary: "{{fields.id}}"
            fields:
              - { name: id, label: Tunniste, widget: string, hint: "Lyhyt nimi ilman välilyöntejä ja ääkkösiä, esim. vexa. Älä vaihda myöhemmin." }
              - { name: cover, label: "Kansikuva (iso kuva projektisivulla)", hint: "MITAT: 1600 × 800 px (2:1). JPG, alle 500 kt. Muun kokoinen kuva näkyy kokonaisena harmailla reunoilla.", widget: image, required: false }
              - { name: tileImage, label: "Pikkukuva projektilistaan (valinnainen)", hint: "MITAT: 1600 × 400 px (4:1). JPG, alle 500 kt. Pidä tärkein kohta keskellä ja vältä reunoja (noin 8 %). Jos jätät tyhjäksi, käytetään kansikuvaa.", widget: image, required: false }
              - { name: tileX, label: "Pikkukuvan kohta vaakasuunnassa", hint: "0 = vasen, 50 = keskellä, 100 = oikea. Toimii vain, kun suurennus on yli 100.", widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
              - { name: tileY, label: "Pikkukuvan kohta pystysuunnassa", hint: "0 = ylhäällä, 50 = keskellä, 100 = alhaalla. Toimii aina.", widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
              - { name: tileZoom, label: "Pikkukuvan suurennus (%)", hint: "100 = ei suurennusta, 150 = lähempää. Tarvitaan, jotta vaakasuunta vaikuttaa.", widget: number, value_type: int, min: 100, max: 300, default: 100, required: false }
              - name: fi
                label: Suomi (FI)
                widget: object
                fields:
                  - { name: title, label: Otsikko, widget: string }
                  - { name: tagline, label: Pikkuteksti otsikon alla, widget: string }
                  - { name: description, label: Kuvaus (tyhjä rivi kappaleiden väliin), widget: text }
              - name: en
                label: Englanti (EN)
                widget: object
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: tagline, label: Small text under title, widget: string }
                  - { name: description, label: Description (empty line between paragraphs), widget: text }
              - name: media
                label: Kuvat ja videot (näkyvät projektisivulla)
                hint: "Kuvat: 1600 × 1200 px (4:3), kaksi rinnakkain. Kuva voi olla jokaisella rivillä joko kuva, video tai YouTube-linkki – täytä vain yksi."
                label_singular: kuva/video
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: Kuva, hint: "MITAT: 1600 × 1200 px (4:3). JPG, alle 500 kt. Muun kokoinen kuva saa harmaat reunat. Nimeä tiedosto ilman välilyöntejä ja ääkkösiä.", widget: image, required: false }
                  - { name: video, label: "Videotiedosto", hint: "mp4 (H.264), 720p, alle 25 Mt. Pidemmät videot YouTubeen listaamattomina.", widget: file, required: false }
                  - { name: youtube, label: "YouTube-linkki (vaihtoehto videotiedostolle)", hint: "Liitä koko linkki, esim. https://youtu.be/...", widget: string, required: false }
                  - { name: caption, label: Kuvateksti, widget: string, required: false }
