# Sivun hallinnan asetukset (Sveltia CMS)
# repo on jo asetettu: xJyri/portfolio (vaihda vain, jos repositorion nimi on eri)

backend:
  name: github
  repo: xJyri/portfolio
  branch: main

media_folder: media
public_folder: media

collections:
  - name: sivu
    label: Sivun sisältö
    files:
      - name: sisalto
        label: Kaikki sisältö
        file: content/site.json
        format: json
        fields:
          - { name: firstName, label: Etunimi, widget: string }
          - { name: lastName, label: Sukunimi, widget: string }
          - { name: email, label: Sähköposti, widget: string, hint: "Tämä kopioituu leikepöydälle, kun kävijä painaa kirjekuorta" }
          - { name: linkedin, label: LinkedIn-osoite, widget: string, hint: "Koko osoite, alkaen https://" }
          - name: fi
            label: Suomi (FI)
            widget: object
            fields:
              - { name: subtitle, label: Alaotsikko etusivulla, widget: string }
              - { name: about, label: "Minusta-teksti (jätä tyhjä rivi kappaleiden väliin)", widget: text }
          - name: en
            label: Englanti (EN)
            widget: object
            fields:
              - { name: subtitle, label: Subtitle on the home page, widget: string }
              - { name: about, label: "About me text (leave an empty line between paragraphs)", widget: text }
          - name: projects
            label: Projektit
            label_singular: projekti
            widget: list
            summary: "{{fields.id}}"
            fields:
              - { name: id, label: Tunniste, widget: string, hint: "Lyhyt nimi ilman välilyöntejä ja ääkkösiä, esim. vexa. Älä vaihda myöhemmin." }
              - { name: cover, label: Kansikuva (projektilistan palkki ja iso kuva), widget: image, required: false }
              - name: fi
                label: Suomi (FI)
                widget: object
                fields:
                  - { name: title, label: Otsikko, widget: string }
                  - { name: tagline, label: Pikkuteksti otsikon alla, widget: string }
                  - { name: description, label: Kuvaus (tyhjä rivi kappaleiden väliin), widget: text }
              - name: en
                label: Englanti (EN)
                widget: object
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: tagline, label: Small text under title, widget: string }
                  - { name: description, label: Description (empty line between paragraphs), widget: text }
              - name: media
                label: Kuvat ja videot (näkyvät projektisivulla)
                label_singular: kuva/video
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { name: image, label: Kuva, widget: image, required: false }
                  - { name: video, label: "Videotiedosto (mp4, mielellään alle 25 Mt)", widget: file, required: false }
                  - { name: youtube, label: "YouTube-linkki (vaihtoehto videotiedostolle)", widget: string, required: false }
                  - { name: caption, label: Kuvateksti, widget: string, required: false }
